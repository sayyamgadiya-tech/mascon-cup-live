name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules, .github/workflows/**]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save google-auth-library@9
      - name: Publish rules
        run: node .github/workflows/deploy-rules.mjs
        env:
          KEY: ${{ secrets.KEY }}
