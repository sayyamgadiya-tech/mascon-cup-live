# Netlify free plan: every deploy costs 15 of 300 monthly credits. Hosting moved to GitHub Pages,
# so Netlify builds are skipped (cost nothing). Remove these two lines to deploy on Netlify again.
[build]
  ignore = "exit 0"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
